<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kitty Shelter Home</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <!-- AOS -->
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css"/>

  <!-- INTERNAL CSS -->
  <style>

    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#fff6f6;
      overflow-x:hidden;
      color:#333;
      transition:0.4s;
    }

    /* LOADER */
    #loader{
      position:fixed;
      width:100%;
      height:100vh;
      background:#ffeef4;
      z-index:9999;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .cat-loader{
      font-size:80px;
      animation:bounce 1s infinite;
    }

    @keyframes bounce{
      0%,100%{transform:translateY(0);}
      50%{transform:translateY(-20px);}
    }

    /* NAVBAR */
    .custom-nav{
      background:rgba(255,255,255,0.8);
      backdrop-filter:blur(10px);
      padding:15px 0;
    }

    .navbar-brand{
      font-size:28px;
      font-weight:700;
      color:#ff5ca8 !important;
    }

    .nav-link{
      color:#333 !important;
      margin-left:15px;
      transition:0.3s;
    }

    .nav-link:hover{
      color:#ff5ca8 !important;
    }

    /* HERO */
    .hero-section{
      position:relative;
      padding-top:100px;
      overflow:hidden;
    }

    .hero-title{
      font-size:60px;
      font-weight:700;
    }

    .hero-title span{
      color:#ff5ca8;
    }

    .hero-text{
      font-size:20px;
      margin:20px 0;
    }

    .hero-cat{
      border-radius:30px;
      width:100%;
      max-width:500px;
      animation:float 3s infinite ease-in-out;
    }

    @keyframes float{
      0%,100%{transform:translateY(0);}
      50%{transform:translateY(-20px);}
    }

    /* BUTTONS */
    .custom-btn{
      background:#ff5ca8;
      color:white;
      border:none;
      padding:12px 30px;
      border-radius:30px;
      transition:0.3s;
    }

    .custom-btn:hover{
      background:#ff2f92;
      color:white;
      transform:scale(1.05);
    }

    .donate-btn{
      background:#7c4dff;
      color:white;
      border:none;
      padding:12px 30px;
      border-radius:30px;
      transition:0.3s;
    }

    .donate-btn:hover{
      background:#5e35d6;
      color:white;
      transform:scale(1.05);
    }

    /* WALKING CAT */
    .walking-cat{
      position:absolute;
      bottom:20px;
      left:-100px;
      font-size:70px;
      animation:walk 15s linear infinite;
    }

    @keyframes walk{
      0%{left:-100px;}
      100%{left:110%;}
    }

    /* PAWS */
    .paw{
      position:absolute;
      font-size:30px;
      opacity:0.2;
      animation:floatpaw 5s infinite;
    }

    .paw1{top:20%; left:10%;}
    .paw2{top:50%; left:80%;}
    .paw3{top:80%; left:30%;}

    @keyframes floatpaw{
      0%{transform:translateY(0);}
      50%{transform:translateY(-20px);}
      100%{transform:translateY(0);}
    }

    /* SECTION TITLE */
    .section-title{
      font-size:45px;
      font-weight:700;
      color:#ff5ca8;
    }

    /* CARDS */
    .cat-card{
      background:white;
      border-radius:25px;
      padding:20px;
      text-align:center;
      transition:0.4s;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
    }

    .cat-card img{
      border-radius:20px;
      height:250px;
      object-fit:cover;
      width:100%;
      margin-bottom:15px;
    }

    .cat-card:hover{
      transform:translateY(-10px);
    }

    /* INFO BOX */
    .info-box{
      background:white;
      padding:30px;
      border-radius:20px;
      transition:0.4s;
      box-shadow:0 5px 20px rgba(0,0,0,0.08);
    }

    .info-box i{
      font-size:50px;
      color:#ff5ca8;
      margin-bottom:20px;
    }

    .info-box:hover{
      transform:translateY(-10px);
    }

    /* DONATION */
    .donation-section{
      background:linear-gradient(to right,#ffb6d9,#d8c1ff);
      border-radius:40px;
      margin:50px;
      color:white;
    }

    /* FOOTER */
    .footer{
      background:#222;
      color:white;
      padding:50px 0;
    }

    .social-icons i{
      font-size:25px;
      margin:10px;
      transition:0.3s;
      cursor:pointer;
    }

    .social-icons i:hover{
      color:#ff5ca8;
      transform:scale(1.2);
    }

    /* DARK MODE */
    .dark-mode{
      background:#121212;
      color:white;
    }

    .dark-mode .cat-card,
    .dark-mode .info-box{
      background:#1f1f1f;
      color:white;
    }

    .dark-mode .custom-nav{
      background:rgba(0,0,0,0.7);
    }

    .dark-mode .nav-link{
      color:white !important;
    }

    /* RESPONSIVE */
    @media(max-width:768px){

      .hero-title{
        font-size:40px;
      }

      .hero-text{
        font-size:18px;
      }

      .section-title{
        font-size:32px;
      }

      .donation-section{
        margin:20px;
      }

    }

  </style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
  <div class="cat-loader">🐈</div>
</div>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg fixed-top custom-nav">
  <div class="container">

    <a class="navbar-brand" href="#">
      🐾 Kitty Shelter Home
    </a>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

      <span class="navbar-toggler-icon"></span>

    </button>

    <div class="collapse navbar-collapse" id="menu">

      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a href="shelter home2.html" class="nav-link">Home</a>
        </li>

        <li class="nav-item">
          <a href="about.html" class="nav-link">About</a>
        </li>

        <li class="nav-item">
          <a href="adopt.html" class="nav-link">Adopt</a>
        </li>

        <li class="nav-item">
          <a href="gallery.html" class="nav-link">Gallery</a>
        </li>

        <li class="nav-item">
          <a href="reviews.html" class="nav-link">Reviews</a>
        </li>

        <li class="nav-item">
          <a href="contact.html" class="nav-link">Contact</a>
        </li>

      </ul>

      <button id="themeToggle" class="btn btn-dark ms-3">
        🌙
      </button>

    </div>
  </div>
</nav>

<!-- HERO -->
<section class="hero-section">

  <div class="container">

    <div class="row align-items-center min-vh-100">

      <div class="col-lg-6">

        <h1 class="hero-title" data-aos="fade-up">
          Welcome to <span>Kitty Shelter Home</span>
        </h1>

        <p class="hero-text" data-aos="fade-up" data-aos-delay="200">
          Giving every cat a loving forever home.
        </p>

        <div data-aos="fade-up" data-aos-delay="400">

          <button class="btn custom-btn me-3">
            Adopt a Cat
          </button>

          <button class="btn donate-btn">
            Donate Now
          </button>

        </div>
      </div>

      <div class="col-lg-6 text-center">

        <img src="https://images.unsplash.com/photo-1519052537078-e6302a4968d4"
             class="hero-cat img-fluid"
             alt="Cute Cat">

      </div>

    </div>
  </div>

  <!-- WALKING CAT -->
  <div class="walking-cat">🐈</div>

  <!-- PAWS -->
  <div class="paw paw1">🐾</div>
  <div class="paw paw2">🐾</div>
  <div class="paw paw3">🐾</div>

</section>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

<script>

  // AOS
  AOS.init();

  // LOADER
  window.addEventListener("load", () => {
    document.getElementById("loader").style.display = "none";
  });

  // DARK MODE
  const themeToggle = document.getElementById("themeToggle");

  themeToggle.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");
  });

</script>

</body>
</html>
