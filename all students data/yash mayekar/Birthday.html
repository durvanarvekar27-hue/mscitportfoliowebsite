```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow:hidden;
    }

    .container{
      text-align:center;
      background:white;
      padding:40px;
      border-radius:20px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
      animation: pop 1s ease;
    }

    h1{
      font-size:60px;
      color:#ff4081;
      margin-bottom:20px;
    }

    p{
      font-size:22px;
      color:#555;
      margin-bottom:25px;
    }

    .btn{
      display:inline-block;
      padding:12px 25px;
      background:#ff4081;
      color:white;
      text-decoration:none;
      border-radius:30px;
      transition:0.3s;
      font-size:18px;
    }

    .btn:hover{
      background:#e91e63;
      transform:scale(1.05);
    }

    .balloon{
      position:absolute;
      width:80px;
      animation: float 6s infinite ease-in-out;
    }

    .balloon:nth-child(1){
      left:10%;
      animation-duration:5s;
    }

    .balloon:nth-child(2){
      left:50%;
      animation-duration:7s;
    }

    .balloon:nth-child(3){
      left:80%;
      animation-duration:6s;
    }

    @keyframes float{
      0%{
        bottom:-100px;
        transform:translateY(0);
      }
      100%{
        bottom:110%;
        transform:translateY(-100vh);
      }
    }

    @keyframes pop{
      0%{
        transform:scale(0.5);
        opacity:0;
      }
      100%{
        transform:scale(1);
        opacity:1;
      }
    }
  </style>
</head>

<body>

  <!-- Balloons -->
  <img class="balloon" src="https://cdn-icons-png.flaticon.com/512/3468/3468377.png">
  <img class="balloon" src="https://cdn-icons-png.flaticon.com/512/3468/3468377.png">
  <img class="balloon" src="https://cdn-icons-png.flaticon.com/512/3468/3468377.png">

  <!-- Main Card -->
  <div class="container">
    <h1>🎉 Happy Birthday 🎂</h1>
    <p>Wishing you joy, happiness, and lots of cake on your special day!</p>
    <a href="#" class="btn">Celebrate 🎈</a>
  </div>

</body>
</html>
```
